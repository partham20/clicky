name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Clicky.sln
      - run: dotnet build Clicky.sln -c Release --no-restore
      - run: dotnet test Clicky.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
